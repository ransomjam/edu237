<!DOCTYPE html>
<html lang="en">
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Camiva - find trusted tutors and manage learning in Cameroon.">
  <meta name="theme-color" content="#1A56DB">
  <meta name="color-scheme" content="light">

  <!-- Installable PWA (Android/Chromium + iOS home screen) -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Camiva">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Camiva</title>
  <link rel="manifest" href="manifest.json">

  <style>
    /* Shown until Flutter paints its first frame, so a slow connection never
       sees a blank white page. Removed on the engine's `flutter-first-frame`
       event (see the script below). */
    html, body { margin: 0; height: 100%; background: #FFFFFF; }
    #splash {
      position: fixed; inset: 0;
      display: flex; align-items: center; justify-content: center;
      transition: opacity 200ms ease-out;
    }
    #splash .spinner {
      width: 40px; height: 40px; border-radius: 50%;
      border: 4px solid #EBF0FD; border-top-color: #1A56DB;
      animation: spin 0.9s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) {
      #splash .spinner { animation: none; }
    }
  </style>
</head>
<body>
  <div id="splash" aria-label="Loading Camiva" role="progressbar">
    <div class="spinner"></div>
  </div>
  <noscript>Camiva needs JavaScript enabled to run.</noscript>

  <!--
    flutter_bootstrap.js is generated by `flutter build web`. It picks the
    renderer automatically: skwasm when built with `--wasm` and the browser
    supports WasmGC, CanvasKit otherwise. No manual renderer config is needed.
  -->
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var splash = document.getElementById('splash');
      if (!splash) return;
      splash.style.opacity = '0';
      setTimeout(function () { splash.remove(); }, 250);
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
